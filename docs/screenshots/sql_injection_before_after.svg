<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card-bg { fill: #1e293b; rx: 8px; stroke: #334155; stroke-width: 1.5; }
      .header-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 700; fill: #f8fafc; }
      .subheader { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; }
      .term-title { font-family: 'Consolas', monospace; font-size: 16px; font-weight: bold; }
      .term-code { font-family: 'Consolas', monospace; font-size: 12px; fill: #cbd5e1; }
      .danger-badge { fill: #ef4444; }
      .success-badge { fill: #10b981; }
      .badge-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .red-text { fill: #f87171; font-weight: bold; }
      .green-text { fill: #4ade80; font-weight: bold; }
      .yellow-text { fill: #fde047; }
      .cyan-text { fill: #38bdf8; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" class="bg"/>

  <!-- Page Title Banner -->
  <text x="40" y="45" class="header-text">SQL Injection Vulnerability vs. Parameterized Query Defense</text>
  <text x="40" y="70" class="subheader">Course: 23EEL43H Web Programming | EL Herbs &amp; Spices Shop | Input: ' OR '1'='1</text>

  <!-- ================= LEFT PANEL: BEFORE (VULNERABLE) ================= -->
  <g transform="translate(40, 95)">
    <!-- Terminal Window -->
    <rect width="540" height="660" class="card-bg" stroke="#ef4444"/>
    
    <!-- Title bar -->
    <rect width="540" height="42" fill="#0f172a" rx="8"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="80" y="26" class="term-title" fill="#f87171">BEFORE: Vulnerable (String Concat)</text>
    <rect x="420" y="10" width="105" height="22" rx="4" class="danger-badge"/>
    <text x="432" y="25" class="badge-text">STATUS: LEAKED</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 70)" class="term-code">
      <text y="0" class="cyan-text">$ curl "http://localhost:5000/api/products/search-vulnerable?q=%27%20OR%20%271%27=%271"</text>
      
      <text y="30" fill="#94a3b8">[1] Raw SQL Query Generated by Server:</text>
      <text y="50" class="red-text">SELECT * FROM products</text>
      <text y="70" class="red-text">WHERE name LIKE '%' OR '1'='1%'</text>

      <text y="105" fill="#94a3b8">[2] Execution Analysis:</text>
      <text y="125" class="yellow-text">• Injected ' closes string literal prematurely</text>
      <text y="145" class="yellow-text">• '1'='1' evaluates to TRUE for EVERY single row</text>
      <text y="165" class="red-text">❌ CRITICAL: WHERE clause is bypassed completely!</text>

      <text y="200" fill="#94a3b8">[3] Database Output (All 8 Rows Dumped):</text>
      <text y="220" class="red-text">HTTP/1.1 200 OK | Count: 8 rows returned</text>
      
      <text y="245" fill="#64748b">┌───┬──────────────────────────────┬────────┬───────┐</text>
      <text y="265" fill="#64748b">│ID │ Product Name                 │ Price  │ Stock │</text>
      <text y="285" fill="#64748b">├───┼──────────────────────────────┼────────┼───────┤</text>
      <text y="305">│ 1 │ Cardamom (Elaichi)           │ ₹450   │ 25 kg │</text>
      <text y="325">│ 2 │ Turmeric Powder (Haldi)      │ ₹180   │ 50 kg │</text>
      <text y="345">│ 3 │ Black Pepper (Kali Mirch)    │ ₹320   │ 40 kg │</text>
      <text y="365">│ 4 │ Cinnamon Sticks (Dalchini)   │ ₹280   │ 15 kg │</text>
      <text y="385">│ 5 │ Clove (Laung)                │ ₹550   │  8 kg │</text>
      <text y="405">│ 6 │ Ginger Powder (Saunth)       │ ₹150   │ 30 kg │</text>
      <text y="425">│ 7 │ Bay Leaf (Tej Patta)         │  ₹90   │  0 kg │</text>
      <text y="445">│ 8 │ Nutmeg (Jaiphal)             │ ₹420   │ 12 kg │</text>
      <text y="465" fill="#64748b">└───┴──────────────────────────────┴────────┴───────┘</text>

      <text y="505" class="red-text">SECURITY VERDICT: VULNERABILITY EXPLOITED</text>
      <text y="525" fill="#cbd5e1">Attacker exfiltrated the entire product table</text>
      <text y="545" fill="#cbd5e1">without proper authorization or matching query.</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: AFTER (DEFENDED) ================= -->
  <g transform="translate(620, 95)">
    <!-- Terminal Window -->
    <rect width="540" height="660" class="card-bg" stroke="#10b981"/>
    
    <!-- Title bar -->
    <rect width="540" height="42" fill="#0f172a" rx="8"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="80" y="26" class="term-title" fill="#4ade80">AFTER: Secure (Parameterized Query)</text>
    <rect x="420" y="10" width="105" height="22" rx="4" class="success-badge"/>
    <text x="432" y="25" class="badge-text">STATUS: DEFENDED</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 70)" class="term-code">
      <text y="0" class="cyan-text">$ curl "http://localhost:5000/api/products/search?q=%27%20OR%20%271%27=%271"</text>
      
      <text y="30" fill="#94a3b8">[1] Parameterized SQL Template with '?' Placeholder:</text>
      <text y="50" class="green-text">SELECT * FROM products</text>
      <text y="70" class="green-text">WHERE name LIKE ?</text>
      <text y="90" fill="#94a3b8">Bound Parameter: <tspan class="cyan-text">["%' OR '1'='1%"]</tspan></text>

      <text y="125" fill="#94a3b8">[2] Execution Analysis:</text>
      <text y="145" class="yellow-text">• SQL compilation occurs BEFORE parameter substitution</text>
      <text y="165" class="yellow-text">• User payload treated strictly as a literal string</text>
      <text y="185" class="green-text">✅ SECURE: Injected quotes cannot alter query logic!</text>

      <text y="220" fill="#94a3b8">[3] Database Output (Safe Empty Set):</text>
      <text y="240" class="green-text">HTTP/1.1 200 OK | Count: 0 rows returned</text>
      
      <text y="275" fill="#64748b">┌───────────────────────────────────────────────────┐</text>
      <text y="295" fill="#64748b">│ (empty table - 0 matches found)                   │</text>
      <text y="315" fill="#64748b">└───────────────────────────────────────────────────┘</text>
      <text y="345" class="cyan-text">{</text>
      <text y="365" class="cyan-text">  "success": true,</text>
      <text y="385" class="cyan-text">  "securityState": "SECURE (Parameterized Query)",</text>
      <text y="405" class="cyan-text">  "matchCount": 0,</text>
      <text y="425" class="cyan-text">  "data": []</text>
      <text y="445" class="cyan-text">}</text>

      <text y="505" class="green-text">SECURITY VERDICT: ATTACK MITIGATED</text>
      <text y="525" fill="#cbd5e1">The application searches for literal text "' OR '1'='1".</text>
      <text y="545" fill="#cbd5e1">Zero records match. Database integrity preserved!</text>
    </g>
  </g>
</svg>
