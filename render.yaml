# Render Infrastructure Blueprint for EL Herbs and Spices Shop Backend
# Course: 23EEL43H Web Programming | Assignment # 2.e Week 5 Day 3

services:
  - type: web
    name: el-herbs-backend
    env: node
    region: singapore # Low latency for Indian subcontinent users
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ALLOWED_ORIGIN
        value: https://el-herbs-shop.netlify.app,https://advaith-renjith-2004.github.io,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: el_herbs_db
      - key: DB_CONNECTION_LIMIT
        value: 10
